[project]
name = "dut-ai-quiz-api"
version = "0.1.0"
description = "Quiz API — FastAPI, DDD-style modules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "greenlet>=3.0",
  "boto3>=1.35",
  "dishka>=1.4.0",
  "arq>=0.26.0",
  "redis>=5.0.1",
  "loguru>=0.7.3",
  "pymupdf>=1.24",
  "pyjwt>=2.13.0",
  "markdown-it-py>=3.0.0",
  "pgvector>=0.4.0",
  "google-genai>=1.0",
  "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.8",
]
