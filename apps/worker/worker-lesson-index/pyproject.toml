[project]
name = "dut-ai-quiz-worker-lesson-index"
version = "0.1.0"
description = "DUT AI Quiz Lesson Index background worker"
requires-python = ">=3.11"
dependencies = [
    "dut-ai-quiz-api",
    "arq>=0.26.0",
]

[tool.uv.sources]
dut-ai-quiz-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_lesson_index"]
