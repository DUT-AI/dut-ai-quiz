[project]
name = "dut-ai-quiz-worker"
version = "0.1.0"
description = "DUT AI Quiz background workers"
requires-python = ">=3.11"
dependencies = [
    "dut-ai-quiz-api",
    "arq>=0.26.0",
    "docker>=7.0.0",
    "py7zr>=1.1.0,<2",
    "rarfile>=4.2,<5",
]

[tool.uv.sources]
dut-ai-quiz-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_hackathon", "worker_lesson_index", "worker_evaluate_homework", "worker_pdf_import"]
