[project]
name = "dut-ai-quiz-worker-pdf-import"
version = "0.1.0"
description = "DUT AI Quiz PDF Import background worker"
requires-python = ">=3.11"
dependencies = [
    "dut-ai-quiz-api",
    "arq>=0.26.0",
    "paddleocr>=2.8",
    "paddlepaddle>=2.6",
    "opendataloader-pdf>=0.2.0",
    "pillow>=10.0",
]

[tool.uv.sources]
dut-ai-quiz-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_pdf_import"]
