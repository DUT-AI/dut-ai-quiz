services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: dut-ai-quiz-postgres
        restart: unless-stopped
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=${POSTGRES_DB:-dut_ai_quiz}
        command: postgres -c timezone='Asia/Ho_Chi_Minh'
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: dut-ai-quiz-redis
        restart: unless-stopped
        environment:
            - TZ=Asia/Ho_Chi_Minh
        ports:
            - "${REDIS_PORT}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    traefik:
        image: traefik:latest
        container_name: dut-ai-quiz-traefik
        restart: unless-stopped
        command:
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--api.insecure=true"
            - "--api.dashboard=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.endpoint=unix:///var/run/docker.sock"
            - "--providers.docker.network=dut-ai-quiz-net"
            - "--providers.docker.constraints=Label(`traefik.project`, `dut-ai-quiz`)"
            - "--entryPoints.web.address=:80"
        ports:
            - "4040:80"
            - "8089:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - default
            - shared

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: dut-ai-quiz-api
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dut_ai_quiz}
            - REDIS_URL=redis://redis:6379/${REDIS_DB:-0}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        ports:
            - "8076:8076"
        networks:
            - default
            - shared
        labels:
            - "traefik.enable=true"
            - "traefik.project=dut-ai-quiz"
            - "traefik.docker.network=dut-ai-quiz-net"
            - "traefik.http.routers.quiz-api.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
            - "traefik.http.routers.quiz-api.entrypoints=web"
            - "traefik.http.routers.quiz-api.priority=100"
            - "traefik.http.routers.quiz-api.middlewares=quiz-api-ratelimit"
            - "traefik.http.services.quiz-api.loadbalancer.server.port=8076"
            # Rate limiting cho API: trung bình 100 req/s, cho phép burst tối đa 50 req
            - "traefik.http.middlewares.quiz-api-ratelimit.ratelimit.average=100"
            - "traefik.http.middlewares.quiz-api-ratelimit.ratelimit.burst=50"
            - "traefik.http.middlewares.quiz-api-ratelimit.ratelimit.period=1s"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker-hackathon:
        build:
            context: .
            dockerfile: apps/worker/worker-hackathon/Dockerfile
        container_name: dut-ai-quiz-worker-hackathon
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dut_ai_quiz}
            - REDIS_URL=redis://redis:6379/${REDIS_DB:-0}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - WORKER_SANDBOX_ROOT=${WORKER_SANDBOX_ROOT:-/tmp/dut-ai-worker}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ${WORKER_SANDBOX_ROOT:-/tmp/dut-ai-worker}:${WORKER_SANDBOX_ROOT:-/tmp/dut-ai-worker}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["uv", "run", "arq", "worker_hackathon.presentation.arq_tasks.WorkerSettings"]

    worker-lesson-index:
        build:
            context: .
            dockerfile: apps/worker/worker-lesson-index/Dockerfile
        container_name: dut-ai-quiz-worker-lesson-index
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dut_ai_quiz}
            - REDIS_URL=redis://redis:6379/${REDIS_DB:-0}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["uv", "run", "arq", "worker_lesson_index.presentation.arq_tasks.WorkerSettings"]

    worker-evaluate-homework:
        build:
            context: .
            dockerfile: apps/worker/worker-evaluate-homework/Dockerfile
        container_name: dut-ai-quiz-worker-evaluate-homework
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - REDIS_URL=redis://redis:6379/${REDIS_DB:-0}
        networks:
            - default
            - shared
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["uv", "run", "arq", "worker_evaluate_homework.presentation.arq_tasks.WorkerSettings"]

    pdf-worker:
        build:
            context: .
            dockerfile: apps/worker/worker-pdf-import/Dockerfile
        container_name: dut-ai-quiz-pdf-worker
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dut_ai_quiz}
            - REDIS_URL=redis://redis:6379/${REDIS_DB:-0}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        networks:
            - default
            - shared
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ["uv", "run", "arq", "worker_pdf_import.presentation.arq_tasks.WorkerSettings"]

    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
            args:
                - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://quiz.dutai.site}
                - NEXT_PUBLIC_MANAGE_LOGIN_URL=${NEXT_PUBLIC_MANAGE_LOGIN_URL:-https://manage.dutai.io.vn/dashboard}
        container_name: dut-ai-quiz-web
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - INTERNAL_API_URL=http://api:8076
        labels:
            - "traefik.enable=true"
            - "traefik.project=dut-ai-quiz"
            - "traefik.docker.network=dut-ai-quiz-net"
            - "traefik.http.routers.quiz-web.rule=PathPrefix(`/`)"
            - "traefik.http.routers.quiz-web.entrypoints=web"
            - "traefik.http.routers.quiz-web.priority=10"
            - "traefik.http.routers.quiz-web.middlewares=quiz-web-ratelimit"
            - "traefik.http.services.quiz-web.loadbalancer.server.port=4040"
            # Rate limiting cho Web: trung bình 200 req/s, cho phép burst tối đa 100 req
            - "traefik.http.middlewares.quiz-web-ratelimit.ratelimit.average=200"
            - "traefik.http.middlewares.quiz-web-ratelimit.ratelimit.burst=100"
            - "traefik.http.middlewares.quiz-web-ratelimit.ratelimit.period=1s"
        depends_on:
            - api

volumes:
    pgdata:

networks:
    default:
        name: dut-ai-quiz-net
    shared:
        name: dut-ai-shared
        external: true
