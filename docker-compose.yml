services:
    postgres:
        image: postgres:16-alpine
        container_name: dut-ai-quiz-postgres
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=${POSTGRES_DB:-dut_ai_quiz}
        command: postgres -c timezone='Asia/Ho_Chi_Minh'
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: dut-ai-quiz-redis
        environment:
            - TZ=Asia/Ho_Chi_Minh
        ports:
            - "${REDIS_PORT}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: dut-ai-quiz-api
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dut_ai_quiz}
            - REDIS_URL=redis://redis:6379/0
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        ports:
            - "8076:8076"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        build:
            context: .
            dockerfile: apps/worker/Dockerfile
        container_name: dut-ai-quiz-worker
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dut_ai_quiz}
            - REDIS_URL=redis://redis:6379/0
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
            args:
                - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://quiz.dutai.site}
                - NEXT_PUBLIC_MANAGE_LOGIN_URL=${NEXT_PUBLIC_MANAGE_LOGIN_URL:-https://manage.dutai.site}
        container_name: dut-ai-quiz-web
        env_file:
            - .env
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - INTERNAL_API_URL=http://api:8076
        ports:
            - "4040:4040"
        depends_on:
            - api

volumes:
    pgdata:
