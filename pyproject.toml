[tool.uv]
workspace = { members = [
  "apps/api",
  "apps/worker/worker-hackathon",
  "apps/worker/worker-lesson-index",
  "apps/worker/worker-evaluate-homework",
  "apps/worker/worker-pdf-import",
] }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
search-path = ["apps/api"]


